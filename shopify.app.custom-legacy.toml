# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "ad1ab25c51472f6f6f0aeb472128db7c"
# CLI overwrites this with the Cloudflare tunnel during `shopify app dev`
application_url = "https://example.com"
embedded = true
name = "MadCircle"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_orders,write_orders,read_customers,write_customers,write_discounts,read_products"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  # Blocked until Protected customer data is approved in Partners:
  # Partners → Apps → MadCircle → API access → Protected customer data
  # Request access (orders + customers), then uncomment and restart `npm run dev`.
  # [[webhooks.subscriptions]]
  # uri = "/webhooks/orders/paid"
  # topics = [ "orders/paid" ]

[auth]
# Must be /auth/callback for this Remix app (NOT /api/auth)
redirect_urls = [ "https://example.com/auth/callback" ]

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true
